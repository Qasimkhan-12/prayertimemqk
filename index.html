<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pakistan Namaz Timing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="top">
  <div class="brand"><span class="logo">☪</span><b data-i18n="app">Pakistan Namaz Timing</b></div>
  <div class="tools">
    <button id="cityBtn" class="pill"><span>📍</span><span id="cityName"></span></button>
    <select id="langSel" aria-label="Language"><option value="en">English</option><option value="ur">اردو</option></select>
    <button id="refBtn" class="icon" aria-label="Refresh">🔄</button>
    <button id="themeBtn" class="icon" aria-label="Theme">🌙</button>
    <button id="setBtn" class="icon" aria-label="Settings">⚙️</button>
  </div>
</header>

<main>
  <!-- WELCOME: shown until the user selects a city -->
  <section id="welcome" class="welcome" hidden>
    <div class="wic">🕌</div>
    <h2 data-i18n="welcomeTitle">Select your city</h2>
    <p data-i18n="welcomeText">Choose your city to see today's prayer times.</p>
    <div class="wbtns">
      <button id="wLoc" class="primary" type="button" data-i18n="useLocation">Use my location</button>
      <button id="wPick" class="secondary" type="button" data-i18n="chooseCity">Choose city</button>
    </div>
  </section>

  <!-- DATE BAR -->
  <section class="datebar">
    <button id="prev" class="icon" aria-label="Previous day">‹</button>
    <div class="dates">
      <h1 id="greg"></h1>
      <p id="hijri"></p>
      <span id="dayTag" class="tag"></span>
    </div>
    <button id="next" class="icon" aria-label="Next day">›</button>
    <div class="quick">
      <button data-d="-1" data-i18n="yesterday">Yesterday</button>
      <button data-d="0" data-i18n="today">Today</button>
      <button data-d="1" data-i18n="tomorrow">Tomorrow</button>
      <input type="date" id="datePick" aria-label="Pick date">
    </div>
  </section>

  <div id="status" class="status" hidden></div>

  <!-- NEXT PRAYER HERO -->
  <section class="hero">
    <p id="heroLabel"></p>
    <h2 id="heroName"></h2>
    <p id="heroSub" class="hsub"></p>
    <div id="count" class="count">--:--:--</div>
    <p id="sun" class="sun"></p>
  </section>

  <!-- FIVE PRAYERS -->
  <section id="cards" class="cards"></section>

  <!-- JUMU'AH (FRIDAY) -->
  <section id="juma" class="panel juma-panel" hidden></section>

  <!-- TIMETABLE -->
  <section class="panel">
    <div class="tabs">
      <button class="on" data-tab="week" data-i18n="weekly">Weekly</button>
      <button data-tab="month" data-i18n="monthly">Monthly</button>
    </div>
    <div class="scroll"><table id="table"></table></div>
  </section>

</main>

<!-- CITY DIALOG -->
<dialog id="cityDlg">
  <div class="dlg-head"><h3 data-i18n="chooseCity">Choose city</h3><button class="icon" data-close>✕</button></div>
  <div class="searchrow">
    <input id="q" type="search" data-ph="search" autocomplete="off">
    <button id="clearQ" class="icon" aria-label="Clear">✕</button>
  </div>
  <div id="chips" class="chips"></div>
  <button id="locBtn" class="wide" data-i18n="useLocation">Use my location</button>
  <ul id="cityList"></ul>
</dialog>

<!-- SETTINGS DIALOG -->
<dialog id="setDlg">
  <div class="dlg-head"><h3 data-i18n="settings">Settings</h3><button class="icon" data-close>✕</button></div>
  <label><span data-i18n="method">Calculation method</span>
    <select id="method">
      <option value="1">University of Islamic Sciences, Karachi</option>
      <option value="2">ISNA</option><option value="3">Muslim World League</option>
      <option value="4">Umm al-Qura, Makkah</option><option value="5">Egyptian General Authority</option>
    </select></label>
  <label><span data-i18n="asr">Asr calculation</span>
    <select id="school"><option value="1" data-i18n="hanafi">Hanafi</option><option value="0" data-i18n="shafi">Shafi</option></select></label>
  <fieldset class="adjbox"><legend data-i18n="adjTitle">Adjust times (minutes)</legend>
    <div id="adj"></div>
    <p class="note" data-i18n="adjNote"></p>
    <button id="adjReset" class="wide" type="button" data-i18n="reset">Reset to Pakistan default</button>
  </fieldset>
  <fieldset class="adjbox"><legend data-i18n="jamSet">Jamaat timings (your mosque)</legend>
    <div id="jamSet"></div>
    <p class="note" data-i18n="jamNote"></p>
    <button id="jamReset" class="wide" type="button" data-i18n="jamReset">Reset jamaat defaults</button>
  </fieldset>
  <fieldset class="adjbox"><legend data-i18n="jumaSet">Jumu'ah timings (your mosque)</legend>
    <div class="jset">
      <label><span data-i18n="khutbah">Khutbah</span><input type="time" id="jKhutbah"></label>
      <label><span data-i18n="jamaat">Jamaat</span><input type="time" id="jJamaat"></label>
    </div>
    <p class="note" data-i18n="jumaNote"></p>
    <button id="jumaReset" class="wide" type="button" data-i18n="jumaReset">Reset to 1:00 / 1:30 PM</button>
  </fieldset>
  <label class="check"><input type="checkbox" id="notify"><span data-i18n="notify">Notify me 10 minutes before each prayer</span></label>
  <p class="note" data-i18n="settingsNote"></p>
</dialog>

<div class="mqk" aria-label="MQK">MQK</div>

<script src="script.js"></script>
</body>
</html>
